<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.5" stop-color="#1e293b"/><stop offset="1" stop-color="#1a365d"/></linearGradient>
    <linearGradient id="accent1" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1a6bff"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="940" height="400" fill="url(#bg1)"/>
  
  <!-- Night desk silhouette -->
  <rect x="0" y="250" width="940" height="150" fill="#0a0f1a" opacity="0.6"/>
  <rect x="100" y="260" width="240" height="12" rx="2" fill="#5c3a1e" opacity="0.5"/>
  <rect x="500" y="260" width="340" height="12" rx="2" fill="#5c3a1e" opacity="0.5"/>
  
  <!-- Scattered paper shapes -->
  <rect x="130" y="235" width="50" height="18" fill="#f5f5dc" opacity="0.15" rx="1" transform="rotate(-4,155,244)"/>
  <rect x="550" y="230" width="55" height="18" fill="#f5f5dc" opacity="0.12" rx="1" transform="rotate(3,577,239)"/>
  <rect x="620" y="238" width="45" height="15" fill="#f5f5dc" opacity="0.1" rx="1" transform="rotate(-2,642,245)"/>
  
  <!-- Coffee cup -->
  <rect x="780" y="238" width="20" height="18" rx="2" fill="#ddd" opacity="0.2"/>
  <path d="M800,244 q6,0 6,6 q0,6 -6,6" fill="none" stroke="#ddd" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Ambient light -->
  <circle cx="850" cy="180" r="200" fill="#ffd700" opacity="0.03"/>
  
  <!-- Diagonal accent line -->
  <line x1="0" y1="0" x2="300" y2="400" stroke="url(#accent1)" stroke-width="2" opacity="0.3"/>
  
  <!-- Series label -->
  <rect x="35" y="30" width="100" height="28" rx="14" fill="#1a6bff" opacity="0.85"/>
  <text x="85" y="49" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#fff">发刊词</text>
  
  <!-- Main title -->
  <text x="50" y="120" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="32" font-weight="bold" fill="#fff">凌晨三点，一份可研报告</text>
  <text x="50" y="162" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="32" font-weight="bold" fill="#fff">的效率真相</text>
  
  <!-- Subtitle -->
  <text x="50" y="205" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#94a3b8">清源智界 · 獴探 正式启航 — 让工程咨询更专业</text>
  
  <!-- Divider -->
  <line x1="50" y1="225" x2="250" y2="225" stroke="#1a6bff" stroke-width="2"/>
  
  <!-- Brand -->
  <text x="50" y="365" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#64748b">深度内容 · 每周一更新</text>
  <text x="890" y="365" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#64748b">清源智界研究院</text>
</svg>
