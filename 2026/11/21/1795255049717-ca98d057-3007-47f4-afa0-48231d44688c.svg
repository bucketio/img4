<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1360" role="img" aria-labelledby="cspd_train_title cspd_train_desc" font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17364A">
<title id="cspd_train_title">冻结模型、只更新软提示的训练过程</title>
<desc id="cspd_train_desc">数学提示和代码提示分别训练。以数学提示为例：专家离线生成示范；将软提示与问题及已有答案前缀送入冻结基础模型，预测下一个 token；把预测与专家答案计算交叉熵；梯度穿过冻结模型回到软提示，只更新软提示。动画为过程示意，不代表训练耗时。</desc>
<defs>
<marker id="cspd_train_arrow_teal" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 8 L2 14" fill="none" stroke="#087F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="cspd_train_arrow_purple" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 8 L2 14" fill="none" stroke="#7457AC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="cspd_train_arrow_blue" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 8 L2 14" fill="none" stroke="#366895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="cspd_train_arrow_orange" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 8 L2 14" fill="none" stroke="#B66B27" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="cspd_train_arrow_muted" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 8 L2 14" fill="none" stroke="#647780" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="750" height="1360" rx="0" fill="#F8F7F2"/>
<text x="32" y="72" font-size="40" font-weight="750" text-anchor="start">只训练软提示，模型保持冻结</text>
<text x="32" y="123" font-size="29" font-weight="500" text-anchor="start" fill="#647780">以数学提示为例；代码提示独立训练</text>
<rect x="40" y="168" width="675" height="184" rx="22" fill="#FFFFFF" stroke="#DDE3E1" stroke-width="2"/>
<g id="cspd_train_state_0" opacity="0">
<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/>
<rect x="41.5" y="169.5" width="672" height="181" rx="21" fill="#E8EFF5" stroke="#366895" stroke-width="3"/>
</g>
<rect x="40" y="398" width="675" height="332" rx="22" fill="#FFFFFF" stroke="#DDE3E1" stroke-width="2"/>
<g id="cspd_train_state_1" opacity="0">
<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/>
<rect x="41.5" y="399.5" width="672" height="329" rx="21" fill="#DFF2EC" stroke="#087F78" stroke-width="3"/>
</g>
<rect x="40" y="776" width="675" height="240" rx="22" fill="#FFFFFF" stroke="#DDE3E1" stroke-width="2"/>
<g id="cspd_train_state_2" opacity="0">
<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/>
<rect x="41.5" y="777.5" width="672" height="237" rx="21" fill="#F9EBD8" stroke="#B66B27" stroke-width="3"/>
</g>
<rect x="40" y="1062" width="675" height="160" rx="22" fill="#FFFFFF" stroke="#DDE3E1" stroke-width="2"/>
<g id="cspd_train_state_3" opacity="0">
<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/>
<rect x="41.5" y="1063.5" width="672" height="157" rx="21" fill="#DFF2EC" stroke="#087F78" stroke-width="3"/>
</g>
<text x="64" y="225" font-size="35" font-weight="750" text-anchor="start" fill="#366895">① 专家离线准备示范</text>
<rect x="64" y="263" width="150" height="60" rx="13" fill="#E8EFF5"/>
<text x="139.0" y="303" font-size="31" font-weight="650" text-anchor="middle" fill="#366895">问题 x</text>
<rect x="269" y="263" width="206" height="60" rx="13" fill="#E8EFF5"/>
<text x="372.0" y="303" font-size="31" font-weight="650" text-anchor="middle" fill="#366895">数学专家</text>
<rect x="530" y="263" width="160" height="60" rx="13" fill="#E8EFF5"/>
<text x="610.0" y="303" font-size="31" font-weight="650" text-anchor="middle" fill="#366895">答案 y</text>
<line x1="226" y1="293" x2="257" y2="293" stroke="#366895" stroke-width="3" stroke-linecap="round" marker-end="url(#cspd_train_arrow_blue)"/>
<line x1="487" y1="293" x2="518" y2="293" stroke="#366895" stroke-width="3" stroke-linecap="round" marker-end="url(#cspd_train_arrow_blue)"/>
<text x="64" y="456" font-size="35" font-weight="750" text-anchor="start" fill="#087F78">② 用冻结模型预测答案</text>
<rect x="64" y="486" width="626" height="61" rx="13" fill="#DFF2EC" stroke="#087F78" stroke-width="1.5"/>
<text x="377" y="526" font-size="31" font-weight="650" text-anchor="middle" fill="#087F78">数学软提示 P + 训练样本上下文</text>
<text x="377" y="589" font-size="29" font-weight="550" text-anchor="middle" fill="#647780">上下文：问题 x + 已有答案前缀</text>
<line x1="377" y1="603" x2="377" y2="626" stroke="#087F78" stroke-width="3" stroke-linecap="round" marker-end="url(#cspd_train_arrow_teal)"/>
<rect x="98" y="641" width="558" height="61" rx="13" fill="#FFFFFF" stroke="#17364A" stroke-width="2"/>
<text x="377" y="682" font-size="33" font-weight="700" text-anchor="middle" fill="#17364A">基础模型 θ：权重冻结</text>
<text x="64" y="834" font-size="35" font-weight="750" text-anchor="start" fill="#B66B27">③ 与专家答案对比</text>
<rect x="64" y="864" width="261" height="62" rx="13" fill="#F9EBD8"/>
<text x="194.5" y="905" font-size="33" font-weight="650" text-anchor="middle" fill="#B66B27">预测概率</text>
<rect x="429" y="864" width="261" height="62" rx="13" fill="#E8EFF5"/>
<text x="559.5" y="905" font-size="33" font-weight="650" text-anchor="middle" fill="#366895">目标答案 y</text>
<text x="377" y="905" font-size="39" font-weight="650" text-anchor="middle" fill="#647780">↔</text>
<text x="377" y="978" font-size="34" font-weight="700" text-anchor="middle" fill="#B66B27">交叉熵 → 训练误差</text>
<text x="64" y="1120" font-size="35" font-weight="750" text-anchor="start" fill="#087F78">④ 反向传播，只更新 P</text>
<text x="64" y="1180" font-size="32" font-weight="550" text-anchor="start" fill="#647780">梯度穿过模型，但 θ 不更新</text>
<line x1="377" y1="362" x2="377" y2="385" stroke="#647780" stroke-width="3" stroke-linecap="round" marker-end="url(#cspd_train_arrow_muted)"/>
<line x1="377" y1="740" x2="377" y2="763" stroke="#647780" stroke-width="3" stroke-linecap="round" marker-end="url(#cspd_train_arrow_muted)"/>
<line x1="377" y1="1026" x2="377" y2="1049" stroke="#647780" stroke-width="3" stroke-linecap="round" marker-end="url(#cspd_train_arrow_muted)"/>
<path d="M40 1146 H17 V516 H53" fill="none" stroke="#087F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cspd_train_arrow_teal)"/>
<g opacity="0" transform="translate(377 362)">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.199999;0.200000;0.249999;0.250000;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 23;0 23" keyTimes="0;0.200000;0.250000;1" dur="16s" begin="0s" repeatCount="indefinite"/>
<circle cx="0" cy="0" r="6" fill="#B66B27"/>
</g></g>
<g opacity="0" transform="translate(377 740)">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.449999;0.450000;0.499999;0.500000;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 23;0 23" keyTimes="0;0.450000;0.500000;1" dur="16s" begin="0s" repeatCount="indefinite"/>
<circle cx="0" cy="0" r="6" fill="#B66B27"/>
</g></g>
<g opacity="0" transform="translate(377 1026)">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.699999;0.700000;0.749999;0.750000;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 23;0 23" keyTimes="0;0.700000;0.750000;1" dur="16s" begin="0s" repeatCount="indefinite"/>
<circle cx="0" cy="0" r="6" fill="#B66B27"/>
</g></g>
<g transform="translate(40 1146)"><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.889999;0.89;0.989999;0.99;1" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;-23 0;-23 -630;13 -630;13 -630" keyTimes="0;0.89;0.9;0.979;0.99;1" dur="16s" begin="0s" repeatCount="indefinite"/>
<circle cx="0" cy="0" r="7" fill="#087F78"/>
</g></g>
<line x1="32" y1="1260" x2="718" y2="1260" stroke="#DDE3E1" stroke-width="2" stroke-linecap="round"/>
<text x="32" y="1304" font-size="29" font-weight="550" text-anchor="start" fill="#647780">共用同一基础模型，每个专家训练自己的 P。</text>
<text x="32" y="1344" font-size="28" font-weight="500" text-anchor="start" fill="#647780">过程示意；播放节奏不代表训练耗时。</text>
</svg>