<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1735" role="img" aria-labelledby="gdn_update_title gdn_update_desc" font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#17384A">
<title id="gdn_update_title">GDN 如何把同一个键的旧内容 A 更新为新内容 B</title>
<desc id="gdn_update_desc">同一单位键的教学示意：旧读数 A=(1,0)，新值 B=(0,1)，保留率 alpha=0.8，写入率 beta=1。真实状态是矩阵，alpha 衰减该头的整个旧状态，图中只观察沿当前键读出的向量；数值不是模型配置。</desc>
<defs><marker id="gdn_update_arrow_teal" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7.5 L2 13" fill="none" stroke="#087F77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<defs><marker id="gdn_update_arrow_orange" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7.5 L2 13" fill="none" stroke="#B76520" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<defs><marker id="gdn_update_arrow_muted" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7.5 L2 13" fill="none" stroke="#607780" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<defs><marker id="gdn_update_arrow_blue" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7.5 L2 13" fill="none" stroke="#3366A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="750" height="1735" rx="0" fill="#F7F9F8"/>
<text x="32" y="69" font-size="41" font-weight="750" text-anchor="start">旧记忆怎样改成新记忆？</text>
<text x="32" y="121" font-size="31" font-weight="400" text-anchor="start" fill="#607780">GDN：先衰减，再按差值定向改写</text>
<rect x="24" y="156" width="702" height="173" rx="23" fill="#17384A"/>
<text x="46" y="204" font-size="34" font-weight="700" text-anchor="start" fill="#FFFFFF">单位键 k：会议地点</text>
<text x="46" y="257" font-size="32" font-weight="650" text-anchor="start" fill="#FFFFFF">旧内容 A=(1,0) → 新内容 B=(0,1)</text>
<text x="46" y="307" font-size="32" font-weight="550" text-anchor="start" fill="#B6DAD9">保留率 α=0.8 ｜ 写入率 β=1</text>
<rect x="24" y="370" width="702" height="180" rx="23" fill="#FFFFFF" stroke="#D9E3E4" stroke-width="2"/>
<g id="gdn_update_highlight_0" opacity="0">
<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
<rect x="25.5" y="371.5" width="699" height="177" rx="22" fill="#EAF0FA" stroke="#3366A6" stroke-width="3"/>
</g>
<text x="46" y="416" font-size="35" font-weight="750" text-anchor="start" fill="#3366A6">① 先看更新前</text>
<text x="375" y="478" font-size="36" font-weight="650" text-anchor="middle" fill="#3366A6">旧读数：S前 k = (1,0)</text>
<text x="375" y="525" font-size="33" font-weight="550" text-anchor="middle" fill="#3366A6">即旧内容 A</text>
<line x1="375" y1="564" x2="375" y2="594" stroke="#607780" stroke-width="3" stroke-linecap="round" marker-end="url(#gdn_update_arrow_muted)"/>
<rect x="24" y="610" width="702" height="180" rx="23" fill="#FFFFFF" stroke="#D9E3E4" stroke-width="2"/>
<g id="gdn_update_highlight_1" opacity="0">
<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
<rect x="25.5" y="611.5" width="699" height="177" rx="22" fill="#FFF0DC" stroke="#B76520" stroke-width="3"/>
</g>
<text x="46" y="656" font-size="35" font-weight="750" text-anchor="start" fill="#B76520">② 衰减整个旧状态</text>
<text x="375" y="718" font-size="36" font-weight="650" text-anchor="middle" fill="#B76520"><tspan text-decoration="overline">S</tspan> = 0.8 S前</text>
<text x="375" y="765" font-size="33" font-weight="550" text-anchor="middle" fill="#B76520">衰减后读数：(0.8,0)</text>
<line x1="375" y1="804" x2="375" y2="834" stroke="#607780" stroke-width="3" stroke-linecap="round" marker-end="url(#gdn_update_arrow_muted)"/>
<rect x="24" y="850" width="702" height="180" rx="23" fill="#FFFFFF" stroke="#D9E3E4" stroke-width="2"/>
<g id="gdn_update_highlight_2" opacity="0">
<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
<rect x="25.5" y="851.5" width="699" height="177" rx="22" fill="#FFF0DC" stroke="#B76520" stroke-width="3"/>
</g>
<text x="46" y="896" font-size="35" font-weight="750" text-anchor="start" fill="#B76520">③ 用新内容减去旧读数</text>
<text x="375" y="958" font-size="36" font-weight="650" text-anchor="middle" fill="#B76520">Δ = (0,1) − (0.8,0)</text>
<text x="375" y="1005" font-size="33" font-weight="550" text-anchor="middle" fill="#B76520">= (−0.8,1)</text>
<line x1="375" y1="1044" x2="375" y2="1074" stroke="#607780" stroke-width="3" stroke-linecap="round" marker-end="url(#gdn_update_arrow_muted)"/>
<rect x="24" y="1090" width="702" height="180" rx="23" fill="#FFFFFF" stroke="#D9E3E4" stroke-width="2"/>
<g id="gdn_update_highlight_3" opacity="0">
<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
<rect x="25.5" y="1091.5" width="699" height="177" rx="22" fill="#E2F3EF" stroke="#087F77" stroke-width="3"/>
</g>
<text x="46" y="1136" font-size="35" font-weight="750" text-anchor="start" fill="#087F77">④ 沿同一键写回差值</text>
<text x="375" y="1198" font-size="36" font-weight="650" text-anchor="middle" fill="#087F77">S新 = <tspan text-decoration="overline">S</tspan> + Δ kᵀ</text>
<text x="375" y="1245" font-size="33" font-weight="550" text-anchor="middle" fill="#087F77">再读该键：S新 k = (0,1)</text>
<rect x="24" y="1320" width="702" height="218" rx="23" fill="#EAF0FA"/>
<text x="46" y="1365" font-size="33" font-weight="750" text-anchor="start" fill="#3366A6">当前键 k 读出的向量</text>
<text x="47" y="1434" font-size="31" font-weight="600" text-anchor="start" fill="#3366A6">A 方向</text>
<text x="47" y="1494" font-size="31" font-weight="600" text-anchor="start" fill="#087F77">B 方向</text>
<rect x="189" y="1408" width="480" height="32" rx="12" fill="#D5DFEC"/>
<rect x="189" y="1468" width="480" height="32" rx="12" fill="#CAE3DD"/>
<g id="gdn_update_state_0" opacity="0">
<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
<text x="687" y="1365" font-size="35" font-weight="750" text-anchor="end" fill="#3366A6">(1,0)</text>
<rect x="189" y="1408" width="480" height="32" rx="12" fill="#3366A6"/>
</g>
<g id="gdn_update_state_1" opacity="0">
<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
<text x="687" y="1365" font-size="35" font-weight="750" text-anchor="end" fill="#3366A6">(0.8,0)</text>
<rect x="189" y="1408" width="384.0" height="32" rx="12" fill="#3366A6"/>
</g>
<g id="gdn_update_state_2" opacity="0">
<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
<text x="687" y="1365" font-size="35" font-weight="750" text-anchor="end" fill="#3366A6">(0.8,0)</text>
<rect x="189" y="1408" width="384.0" height="32" rx="12" fill="#3366A6"/>
</g>
<g id="gdn_update_state_3" opacity="1">
<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
<text x="687" y="1365" font-size="35" font-weight="750" text-anchor="end" fill="#3366A6">(0,1)</text>
<rect x="189" y="1468" width="480" height="32" rx="12" fill="#087F77"/>
</g>
<g opacity="0" transform="translate(375 564)">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.189999;0.190000;0.249999;0.250000;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 30;0 30" keyTimes="0;0.190000;0.250000;1" dur="20s" begin="0s" repeatCount="indefinite"/>
<circle cx="0" cy="0" r="7" fill="#B76520"/>
</g></g>
<g opacity="0" transform="translate(375 804)">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.439999;0.440000;0.499999;0.500000;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 30;0 30" keyTimes="0;0.440000;0.500000;1" dur="20s" begin="0s" repeatCount="indefinite"/>
<circle cx="0" cy="0" r="7" fill="#B76520"/>
</g></g>
<g opacity="0" transform="translate(375 1044)">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.689999;0.690000;0.749999;0.750000;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 30;0 30" keyTimes="0;0.690000;0.750000;1" dur="20s" begin="0s" repeatCount="indefinite"/>
<circle cx="0" cy="0" r="7" fill="#B76520"/>
</g></g>
<line x1="32" y1="1568" x2="718" y2="1568" stroke="#D9E3E4" stroke-width="2" stroke-linecap="round"/>
<text x="32" y="1606" font-size="29" font-weight="400" text-anchor="start" fill="#607780">实际状态是矩阵；α 衰减该头的整个旧状态。</text>
<text x="32" y="1649" font-size="29" font-weight="400" text-anchor="start" fill="#607780">同一单位键、β=1 的教学例子；非模型配置。</text>
<text x="32" y="1692" font-size="29" font-weight="400" text-anchor="start" fill="#607780">20 秒为过程演示节奏。</text>
</svg>